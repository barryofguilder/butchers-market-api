name: CI

on:
  pull_request:
    # `ready_for_review` runs CI when a draft PR is marked ready.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its in-progress run; runs on master are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # Reads `volta.node`, so CI uses the same Node version as local development and Render.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
